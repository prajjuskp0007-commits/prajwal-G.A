<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131c">
  <title>Pong — Arcade Game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f4f6ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: radial-gradient(ellipse at 50% 0%, #20283a 0%, #10131c 65%);
    }

    .game { width: min(100%, 920px); }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #8d98b5;
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.4rem); letter-spacing: -.05em; }

    .scoreboard { display: flex; align-items: center; gap: 15px; text-align: center; }
    .score { min-width: 46px; }
    .score span { display: block; color: #8d98b5; font-size: .65rem; font-weight: 750; letter-spacing: .12em; }
    .score strong { display: block; margin-top: 2px; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
    .divider { color: #57617a; font-size: 1.5rem; }

    .board {
      position: relative;
      overflow: hidden;
      border: 1px solid #30394f;
      border-radius: 16px;
      background: #151a27;
      box-shadow: 0 24px 80px #0006, inset 0 1px #ffffff08;
    }

    canvas { display: block; width: 100%; height: auto; aspect-ratio: 900 / 560; touch-action: none; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #10131caa;
      text-align: center;
      backdrop-filter: blur(3px);
    }

    .overlay[hidden] { display: none; }
    .overlay-card { max-width: 390px; }
    .overlay h2 { margin: 0 0 8px; font-size: clamp(1.5rem, 5vw, 2.2rem); }
    .overlay p { margin: 0 0 18px; color: #b6bfd4; line-height: 1.55; }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      color: #10131c;
      background: #7cf0c5;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    button:hover { transform: translateY(-1px); background: #a0ffdb; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .help {
      display: flex;
      justify-content: space-between;
      gap: 12px 24px;
      margin-top: 14px;
      color: #8d98b5;
      font-size: .82rem;
    }
    .help strong { color: #dce2f2; font-weight: 650; }

    @media (max-width: 560px) {
      .topbar { align-items: center; }
      .help { flex-direction: column; }
      .scoreboard { gap: 8px; }
      .score { min-width: 36px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="topbar">
      <div>
        <p class="eyebrow">A little arcade classic</p>
        <h1>Pong</h1>
      </div>
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score"><span>YOU</span><strong id="player-score">0</strong></div>
        <span class="divider" aria-hidden="true">:</span>
        <div class="score"><span>CPU</span><strong id="cpu-score">0</strong></div>
      </div>
    </header>

    <section class="board" aria-label="Pong game">
      <canvas id="game-canvas" width="900" height="560" aria-label="Pong playfield. Move your mouse or use the up and down arrow keys to control the left paddle."></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlay-title">Ready to play?</h2>
          <p id="overlay-message">First to 5 points wins. Move your mouse or use ↑ and ↓ to control your paddle.</p>
          <button id="start-button" type="button">Start game</button>
        </div>
      </div>
    </section>

    <footer class="help">
      <span><strong>Move:</strong> Mouse or ↑ / ↓ arrow keys</span>
      <span><strong>Pause:</strong> Space &nbsp;·&nbsp; <strong>Restart:</strong> R</span>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayMessage = document.getElementById('overlay-message');
      const startButton = document.getElementById('start-button');
      const playerScoreElement = document.getElementById('player-score');
      const cpuScoreElement = document.getElementById('cpu-score');

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const PADDLE_WIDTH = 13;
      const PADDLE_HEIGHT = 96;
      const BALL_RADIUS = 9;
      const WINNING_SCORE = 5;
      const keys = new Set();

      const player = { x: 34, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, score: 0 };
      const cpu = { x: WIDTH - 34 - PADDLE_WIDTH, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, score: 0 };
      const ball = { x: WIDTH / 2, y: HEIGHT / 2, vx: 0, vy: 0 };
      let running = false;
      let serving = false;
      let mouseTarget = null;
      let lastTime = 0;
      let serveTimer = null;

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

      function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#151a27';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.setLineDash([9, 13]);
        ctx.strokeStyle = '#384157';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(WIDTH / 2, 22);
        ctx.lineTo(WIDTH / 2, HEIGHT - 22);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#7cf0c5';
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, PADDLE_WIDTH, PADDLE_HEIGHT, 7);
        ctx.fill();

        ctx.fillStyle = '#a4b0ce';
        ctx.beginPath();
        ctx.roundRect(cpu.x, cpu.y, PADDLE_WIDTH, PADDLE_HEIGHT, 7);
        ctx.fill();

        ctx.fillStyle = '#f4f6ff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }

      function updateScore() {
        playerScoreElement.textContent = player.score;
        cpuScoreElement.textContent = cpu.score;
      }

      function resetBall(direction) {
        ball.x = WIDTH / 2;
        ball.y = HEIGHT / 2;
        ball.vx = 0;
        ball.vy = 0;
        serving = true;
        clearTimeout(serveTimer);
        serveTimer = setTimeout(() => {
          if (!running) return;
          const angle = (Math.random() * 0.7 - 0.35);
          const speed = 440;
          ball.vx = Math.cos(angle) * speed * direction;
          ball.vy = Math.sin(angle) * speed;
          serving = false;
        }, 650);
      }

      function showOverlay(title, message, buttonText) {
        overlayTitle.textContent = title;
        overlayMessage.textContent = message;
        startButton.textContent = buttonText;
        overlay.hidden = false;
      }

      function startGame() {
        if (player.score >= WINNING_SCORE || cpu.score >= WINNING_SCORE) {
          player.score = 0;
          cpu.score = 0;
          updateScore();
        }
        running = true;
        overlay.hidden = true;
        resetBall(Math.random() < 0.5 ? -1 : 1);
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }

      function pauseGame() {
        running = false;
        clearTimeout(serveTimer);
        showOverlay('Paused', 'Take a breather. Your score is saved.', 'Resume');
        draw();
      }

      function endGame(winner) {
        running = false;
        clearTimeout(serveTimer);
        showOverlay(winner === 'player' ? 'You win! 🎉' : 'CPU wins', 'Final score: ' + player.score + ' : ' + cpu.score + '. Want another round?', 'Play again');
      }

      function scorePoint(who) {
        if (who === 'player') player.score += 1;
        else cpu.score += 1;
        updateScore();
        if (player.score >= WINNING_SCORE || cpu.score >= WINNING_SCORE) {
          endGame(player.score >= WINNING_SCORE ? 'player' : 'cpu');
          return;
        }
        resetBall(who === 'player' ? 1 : -1);
      }

      function movePaddle(paddle, targetY) {
        paddle.y = clamp(targetY, 0, HEIGHT - PADDLE_HEIGHT);
      }

      function update(delta) {
        const playerSpeed = 560;
        let keyboardDirection = 0;
        if (keys.has('ArrowUp')) keyboardDirection -= 1;
        if (keys.has('ArrowDown')) keyboardDirection += 1;

        if (keyboardDirection !== 0) {
          movePaddle(player, player.y + keyboardDirection * playerSpeed * delta);
        } else if (mouseTarget !== null) {
          movePaddle(player, mouseTarget - PADDLE_HEIGHT / 2);
        }

        // The computer tracks the ball but has a speed limit, so it remains beatable.
        const cpuTarget = ball.vx > 0 ? ball.y - PADDLE_HEIGHT / 2 : HEIGHT / 2 - PADDLE_HEIGHT / 2;
        const cpuStep = clamp(cpuTarget - cpu.y, -390 * delta, 390 * delta);
        movePaddle(cpu, cpu.y + cpuStep);

        if (serving) return;

        ball.x += ball.vx * delta;
        ball.y += ball.vy * delta;

        if (ball.y - BALL_RADIUS <= 0) {
          ball.y = BALL_RADIUS;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + BALL_RADIUS >= HEIGHT) {
          ball.y = HEIGHT - BALL_RADIUS;
          ball.vy = -Math.abs(ball.vy);
        }

        // Paddle collision is checked only while the ball is moving toward that paddle.
        const hitsPlayer = ball.vx < 0 && ball.x - BALL_RADIUS <= player.x + PADDLE_WIDTH &&
          ball.x + BALL_RADIUS >= player.x && ball.y + BALL_RADIUS >= player.y && ball.y - BALL_RADIUS <= player.y + PADDLE_HEIGHT;
        const hitsCpu = ball.vx > 0 && ball.x + BALL_RADIUS >= cpu.x &&
          ball.x - BALL_RADIUS <= cpu.x + PADDLE_WIDTH && ball.y + BALL_RADIUS >= cpu.y && ball.y - BALL_RADIUS <= cpu.y + PADDLE_HEIGHT;

        if (hitsPlayer) {
          ball.x = player.x + PADDLE_WIDTH + BALL_RADIUS;
          bounceFromPaddle(player, 1);
        } else if (hitsCpu) {
          ball.x = cpu.x - BALL_RADIUS;
          bounceFromPaddle(cpu, -1);
        }

        if (ball.x + BALL_RADIUS < 0) scorePoint('cpu');
        else if (ball.x - BALL_RADIUS > WIDTH) scorePoint('player');
      }

      function bounceFromPaddle(paddle, direction) {
        const paddleCenter = paddle.y + PADDLE_HEIGHT / 2;
        const impact = clamp((ball.y - paddleCenter) / (PADDLE_HEIGHT / 2), -1, 1);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.06, 760);
        const angle = impact * (Math.PI / 3);
        ball.vx = Math.cos(angle) * speed * direction;
        ball.vy = Math.sin(angle) * speed;
      }

      function loop(timestamp) {
        if (!running) return;
        const delta = Math.min((timestamp - lastTime) / 1000, 0.03);
        lastTime = timestamp;
        update(delta);
        draw();
        requestAnimationFrame(loop);
      }

      function setMouseTarget(event) {
        const rect = canvas.getBoundingClientRect();
        mouseTarget = (event.clientY - rect.top) * (HEIGHT / rect.height);
      }

      canvas.addEventListener('pointermove', setMouseTarget);
      canvas.addEventListener('pointerleave', () => { mouseTarget = null; });

      window.addEventListener('keydown', (event) => {
        if (['ArrowUp', 'ArrowDown', ' '].includes(event.key)) event.preventDefault();
        keys.add(event.key);
        if (event.key === ' ' && !event.repeat) {
          if (running) pauseGame();
          else startGame();
        }
        if (event.key.toLowerCase() === 'r') {
          player.score = 0;
          cpu.score = 0;
          updateScore();
          running = true;
          overlay.hidden = true;
          resetBall(Math.random() < 0.5 ? -1 : 1);
          lastTime = performance.now();
          requestAnimationFrame(loop);
        }
      });
      window.addEventListener('keyup', (event) => keys.delete(event.key));
      window.addEventListener('blur', () => keys.clear());
      startButton.addEventListener('click', startGame);

      updateScore();
      draw();
    })();
  </script>
</body>
</html>
